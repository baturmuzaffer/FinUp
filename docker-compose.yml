

services:
  db:
    image: postgres:15-alpine
    container_name: finup-postgres
    restart: always
    environment:
      POSTGRES_USER: finup_user
      POSTGRES_PASSWORD: finup_password
      POSTGRES_DB: finup_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finup-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finup-backend
    restart: always
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://finup_user:finup_password@db:5432/finup_db
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finup-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000/api

volumes:
  postgres_data:
  redis_data:
